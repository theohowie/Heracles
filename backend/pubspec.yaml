name: heracles_backend
description: Heracles 后端 —— 基于 dart_agent_core 的云端 Agent 编排层。
version: 0.1.0
publish_to: none

# ============================================================================
# 为什么是独立包而不是塞进 app/
# ============================================================================
#
# 1. **可单测**：纯 Dart 包能跑 `dart test`，不需要模拟器、不需要 Flutter。
#    编排逻辑（循环、预算、工具调度、缓存对齐）必须能在毫秒级验证。
# 2. **强制边界**：这个包**不得** import `package:flutter/*`。
#    后端不该知道 UI 的存在 —— 事件通过 Stream 出去，UI 自己消费。
# 3. **可 CLI**：将来想在没有 UI 的情况下跑一次任务（排查/压测），
#    直接 `dart run` 即可。
# ============================================================================

environment:
  sdk: ^3.12.2

dependencies:
  # 编排层：agent 循环、工具调度、计划、循环检测、hooks、MCP、子代理
  #
  # ★ 2026-10-27：**改为仓库内 vendored 源码**（原来是 `^2.1.8` 的 hosted 包）。
  #
  # 为什么：框架是外部 pub 包（MIT，17,214 行），我们要改的挂载点全在它里面
  # （`systemReminders` 注入、`ToolResultHookResult.injectedMessages`、工具流式输出、
  # 并行工具调度）。hosted 包改不动，改 fork 又要每次上游发版手动合 ——
  # 内联进 `core/` 后，改一行就是改一行。
  #
  # 代价（必须记住）：
  #  · 它不再受 pub 版本约束，`pub upgrade` 不会动它 —— **升级要手动**（见 `core/VENDOR.md`）；
  #  · 它带着 MIT 许可证，不是本仓库的 GPL-3.0 —— 版权声明在根目录 `THIRD_PARTY_NOTICES.md`，别删；
  #  · 本包是纯 Dart，vendored 之后 `backend` 仍然不能 import flutter（约束不变）。
  dart_agent_core:
    path: ../core

  # 流式/取消：dart_agent_core 的 CancelToken 就来自 dio，这里必须一致
  dio: ^5.11.1

  # 用于工具参数的 JSON 处理（stdlib 的 dart:convert 够用，但保留显式意图）
  meta: ^1.18.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
