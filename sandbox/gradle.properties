# Heracles-taixu-sandbox — Gradle 配置
#
# 注意：本机为 Windows + 8GB 级别内存的开发机，构建并发刻意压低，
# 避免 kotlin daemon 与 gradle daemon 抢内存导致 OOM 假失败。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
