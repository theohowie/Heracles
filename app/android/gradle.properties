org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# ---------------------------------------------------------------------------
# Kotlin 增量编译在 Windows 上会因文件锁冲突而失败：
#   Could not close incremental caches in ... cacheable/caches-jvm/...
# 新引入插件（如 shared_preferences_android）首次编译时必现。
# 关闭它 —— 构建频率不高，可靠比快重要。
# ---------------------------------------------------------------------------
kotlin.incremental=false
kotlin.incremental.android=false

# ---------------------------------------------------------------------------
# ★ 只打 arm64-v8a（2026-10-30，用户要求「只构建一个 arm64 的包」）
#
# Flutter Gradle 插件在 afterEvaluate 里会 `abiFilters.clear()` 再
# `addAll(PLATFORM_ABI_LIST)`（FlutterPlugin.kt:596-599），把 build.gradle.kts
# 里声明的 abiFilters 直接覆盖掉 —— 这就是 0.3.1/0.3.2 包里明明只给了
# android-arm64 引擎、却仍带 v7a/x86_64 原生库（约 19 MiB 死重）的原因。
#
# 下面这个属性是插件自己的开关（FlutterPluginUtils: PROP_DISABLE_ABI_FILTERING）：
# 置 true 后它不再改写，app/build.gradle.kts 里 defaultConfig 的 arm64 白名单才生效。
#
# ⚠️ 副作用：debug 构建同样只带 arm64 ⇒ 在 x86_64 模拟器上 `flutter run` 装不上；
#    真机（arm64）不受影响。无需该限制时删掉本行即可。
# ---------------------------------------------------------------------------
disable-abi-filtering=true
